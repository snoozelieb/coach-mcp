name: CI

on:
  push:
  pull_request:
  # Manual trigger — also the recovery path when GitHub's 60-day inactivity
  # rule auto-disables this workflow (it did on 2026-08-10: the schedule
  # trigger makes the whole workflow eligible, and disabling kills the push
  # trigger too; re-enable with `gh workflow enable ci.yml`).
  workflow_dispatch:
  schedule:
    # Weekly Monday run catches date-rot: tests whose hardcoded or relative
    # dates drift into the past even when no code changes.
    - cron: '0 5 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches local dev (3.14); all pinned deps support it.
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pins the test stack and pulls in
        # requirements.txt (runtime deps) via its -r include.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # test_fixtures.json is gitignored (personal health data), so this is
        # the clean-checkout path: fixture-dependent tests skip via conftest.
        run: python -m pytest -q
