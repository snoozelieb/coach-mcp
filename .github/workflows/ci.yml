name: CI

env:
  # FastMCP 4 keeps camelCase compatibility shims for MCP model fields
  # (readOnlyHint -> read_only_hint). Run CI without them so a reintroduced
  # camelCase read fails here instead of after the shims are removed upstream.
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

on:
  push:
  pull_request:
  # Manual trigger — also the recovery path when GitHub's 60-day inactivity
  # rule auto-disables this workflow (it did on 2026-08-10: the schedule
  # trigger makes the whole workflow eligible, and disabling kills the push
  # trigger too; re-enable with `gh workflow enable ci.yml`).
  workflow_dispatch:
  schedule:
    # Weekly Monday run catches date-rot: tests whose hardcoded or relative
    # dates drift into the past even when no code changes.
    - cron: '0 5 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dev dependencies (pins ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # Rule set and per-file ignores live in pyproject.toml [tool.ruff].
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml advertises >=3.12; local dev runs 3.14.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pins the test stack and pulls in
        # requirements.txt (runtime deps) via its -r include.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # test_fixtures.json is gitignored (personal health data), so this is
        # the clean-checkout path: fixture-dependent tests skip via conftest.
        run: python -m pytest -q
