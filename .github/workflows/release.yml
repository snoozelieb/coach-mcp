# Release pipeline: pushing a v* tag builds sdist+wheel, publishes to PyPI
# via trusted publishing (OIDC — no token stored in the repo; the owner
# configures the trusted publisher on pypi.org, see docs/PUBLISHING.md),
# then creates a GitHub Release with the artifacts and CHANGELOG excerpt and
# registers server.json with the official MCP Registry (OIDC again).
# Release creation happens HERE (GITHUB_TOKEN), never from a local gh CLI.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify tag matches pyproject version
        run: |
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/garmin-coach-mcp
    permissions:
      # Mandatory for PyPI trusted publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # Trusted publishing: no API token. PEP 740 attestations are generated
      # and uploaded by default (action >= v1.11.0).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract changelog excerpt
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && (/^## \[/ || /^---/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "coach-mcp $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # Registers server.json with the official MCP Registry once PyPI has the
  # release (the registry fetches pypi.org/pypi/<pkg>/<version>/json and
  # checks the README's "mcp-name:" marker, so this must run after the
  # upload). Safety model:
  #   - No secret anywhere: `login github-oidc` exchanges the job's GitHub
  #     OIDC token at the registry, which grants publish rights for
  #     io.github.<repository owner>/* — the same trust model as GHCR. Only a
  #     tag push to THIS repo (owner-only) can trigger it; forks get their own
  #     owner claim and cannot touch this namespace.
  #   - The publisher binary is pinned to an immutable release tag, its
  #     Sigstore bundle must have been signed by the registry's own release
  #     workflow for that tag, AND its SHA-256 must match the value recorded
  #     here. Bumping the version means updating both pins deliberately
  #     (docs/PUBLISHING.md explains how); never the mutable "latest" alias.
  #   - Failure here never blocks the GitHub Release (independent job) and a
  #     re-run of just this job is safe: the registry refuses duplicates.
  publish-to-mcp-registry:
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write  # OIDC token for the registry exchange
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.5
      # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.5_checksums.txt
      MCP_PUBLISHER_SHA256: "2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812"
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for v in $(jq -r '.version, .packages[0].version' server.json); do
            if [ "$v" != "$TAG_VERSION" ]; then
              echo "::error::server.json version ($v) != tag ($TAG_VERSION)"
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check --strict -
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --help > /dev/null

      - name: Authenticate to the MCP Registry (OIDC)
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      # PyPI's JSON API can lag the upload by a minute or two and the registry
      # validates the exact version there. Retry only that transient class;
      # any other rejection (duplicate version, bad server.json) fails at once.
      - name: Publish server.json to the MCP Registry
        run: |
          set -uo pipefail
          for attempt in $(seq 1 10); do
            if "$RUNNER_TEMP/mcp-publisher" publish 2>&1 | tee publish.log; then
              exit 0
            fi
            if grep -q -i -E "not found|retry" publish.log; then
              echo "::notice::attempt $attempt: PyPI metadata not visible yet, retrying in 30s"
              sleep 30
            else
              exit 1
            fi
          done
          echo "::error::MCP Registry publish failed after 10 attempts"
          exit 1
