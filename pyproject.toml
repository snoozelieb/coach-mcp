# Project metadata + pinned dependency stack (Phase 4.5). The package is run
# from a checkout (python server.py), not built/installed — [project] exists
# so the dependency stack is pinned in one canonical place alongside the
# pytest config. requirements.txt mirrors [project].dependencies for the
# documented pip-install path; keep the two in sync.
[project]
name = "coach-mcp"
version = "0.4.0"
description = "Adaptive AI training coach MCP server backed by Garmin Connect"
requires-python = ">=3.12"  # CI + local dev run 3.14
dependencies = [
    "garminconnect==0.3.5",
    "fastmcp>=3.4,<4",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "anthropic>=0.109.1,<1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
