# Project metadata + pinned dependency stack. Installable via pip/uvx as
# "garmin-coach-mcp" (console scripts: garmin-coach-mcp + coach-mcp alias)
# AND runnable from a checkout (python server.py).
# requirements.txt mirrors [project].dependencies for the documented
# pip-install path; keep the two in sync.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-coach-mcp"
version = "1.3.0"
description = "Adaptive AI training coach MCP server backed by Garmin Connect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"  # CI + local dev run 3.14
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "garmin",
    "training",
    "coaching",
    "fitness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect==0.3.20",
    "fastmcp>=4.1,<5",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/snoozelieb/coach-mcp"
Repository = "https://github.com/snoozelieb/coach-mcp"
Changelog = "https://github.com/snoozelieb/coach-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/snoozelieb/coach-mcp/issues"

[project.scripts]
garmin-coach-mcp = "coach.server:main"
coach-mcp = "coach.server:main"
garmin-coach-setup = "coach.setup_wizard:main"
garmin-coach-login = "coach.garmin_login:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
]

[tool.hatch.build.targets.wheel]
# Ship the coach package only; non-Python files under it (notably
# coach/defaults/*.json, the bootstrap seed data) are included by default.
packages = ["coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
# Lint gate (CI: `ruff check .`). Default rule set (pyflakes + pycodestyle
# errors); style-only rules are deliberately not enabled.
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E731",  # lambda assignment — used deliberately in tests for tiny stubs
    "E741",  # ambiguous single-letter names in a few comprehensions
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]                 # sys.path setup precedes imports
"coach/tools/coaching_tools.py" = ["E402"]  # late imports break an import cycle
"coach/server.py" = ["F401"]              # tool/resource modules are imported for registration

[project.optional-dependencies]
# COACH_CODE_MODE=1 needs the Monty sandbox: pip install "garmin-coach-mcp[code-mode]"
code-mode = ["fastmcp[code-mode]>=4.1,<5"]
